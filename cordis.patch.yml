# ============================================================================
# dsh-agent-guard bundle patch — mounts this plugin into a profile's config tree.
#
# Install (same shape as the official bundles):
#   dsh plugin --profile <profile> add <absolute-path-or-package>
# Local development:
#   dsh plugin --profile <profile> add link:<absolute path to this directory>
#
# Notes:
#   - This plugin publishes NO service, so it can be inserted as an ordinary row;
#     no `isolate` realm is required.
#   - The row id matches package.json's `name`, so later patches can target it by id.
#   - `name:` is the module specifier the loader imports; the plugin never names
#     itself, and a package without `dsh.bundle` is installed but NOT mounted.
#   - v0 wires up read-only inspection only. If you do not want it mounted at all,
#     delete the insert below: the plugin contributes nothing else, and no data of
#     its own exists yet.
#   - Keep this file minimal. `!!js` expressions are evaluated in the host process
#     and are deliberately NOT used here.
# ============================================================================

- insert:
    - id: dsh-agent-guard
      name: dsh-agent-guard
